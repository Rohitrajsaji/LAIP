name: laip-tests
services:
  database:
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: laip_test
      POSTGRES_DB: laip_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:${LAIP_TEST_PORT:-55433}:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U laip_test -d laip_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs: [/tmp]
