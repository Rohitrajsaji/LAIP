[project]
name = "laip-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.6",
    "jsonschema==4.26.0",
    "lark==1.3.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "httpx==0.28.1", "ruff==0.16.10", "mypy==2.4.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=laip --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
